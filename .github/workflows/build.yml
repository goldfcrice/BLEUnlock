name: Build BLEUnlock

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project BLEUnlock.xcodeproj \
            -scheme BLEUnlock \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log

      - name: Package app
        run: |
          APP=$(find build/Build/Products/Release -name "BLEUnlock.app" -maxdepth 2 | head -1)
          # Ad-hoc 签名，保证本地可运行
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" BLEUnlock.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLEUnlock-app
          path: BLEUnlock.app.zip
